<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十二星座おみくじルーレット</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-indigo-950 via-purple-900 to-indigo-900 min-h-screen font-sans text-white">

<div class="max-w-xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-yellow-300 mb-1">✨ 十二星座おみくじルーレット</h1>
  <p class="text-center text-indigo-300 text-sm mb-4">宇宙的スケールで今日の運勢を占う</p>

  <!-- Zodiac selector -->
  <div class="bg-indigo-900 bg-opacity-60 rounded-xl border border-indigo-700 p-4 mb-4">
    <label for="zodiac-select" class="block text-sm text-indigo-300 mb-2">星座を選んでください</label>
    <select id="zodiac-select" tabindex="0" aria-label="星座を選択"
      class="w-full bg-indigo-800 border border-indigo-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
    </select>
    <button id="spin-btn" onclick="startSpin()" aria-label="ルーレットを回す"
      class="mt-3 w-full py-2.5 bg-yellow-400 hover:bg-yellow-300 text-indigo-900 font-bold rounded-lg transition text-sm">
      🌀 ルーレットを回す！
    </button>
  </div>

  <!-- Canvas roulette -->
  <div class="flex justify-center mb-4 relative">
    <canvas id="wheel-canvas" width="320" height="320"
      class="rounded-full shadow-2xl" aria-label="ルーレット"></canvas>
    <!-- Pointer -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2" style="margin-top:-135px;">
      <div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid #fbbf24;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));"></div>
    </div>
  </div>

  <!-- Fortune result -->
  <div id="fortune-box" class="hidden bg-indigo-900 bg-opacity-70 border border-yellow-400 rounded-xl p-4 mb-4">
    <div class="flex items-center gap-2 mb-2">
      <span id="fortune-zodiac-icon" class="text-2xl"></span>
      <div>
        <p class="font-bold text-yellow-300" id="fortune-zodiac-name"></p>
        <p class="text-xs text-indigo-300" id="fortune-date"></p>
      </div>
    </div>
    <p id="fortune-rank" class="text-lg font-bold mb-2"></p>
    <p id="fortune-text" class="text-sm text-indigo-100 leading-relaxed"></p>
  </div>

  <!-- History -->
  <div class="bg-indigo-900 bg-opacity-40 rounded-xl border border-indigo-700 p-4">
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-sm font-semibold text-indigo-300">今日の記録</h2>
      <button onclick="clearHistory()" aria-label="履歴を削除"
        class="text-xs text-red-400 hover:text-red-300 transition">全削除</button>
    </div>
    <div id="history-list" class="space-y-1.5"></div>
    <p id="history-empty" class="text-indigo-500 text-xs text-center py-2">まだ記録がありません</p>
  </div>
</div>

<script>
  const ZODIACS = [
    { name: '牡羊座',   range: '3/21-4/19',  icon: '♈', color: '#ef4444' },
    { name: '牡牛座',   range: '4/20-5/20',  icon: '♉', color: '#f59e0b' },
    { name: '双子座',   range: '5/21-6/21',  icon: '♊', color: '#10b981' },
    { name: '蟹座',     range: '6/22-7/22',  icon: '♋', color: '#06b6d4' },
    { name: '獅子座',   range: '7/23-8/22',  icon: '♌', color: '#f97316' },
    { name: '乙女座',   range: '8/23-9/22',  icon: '♍', color: '#84cc16' },
    { name: '天秤座',   range: '9/23-10/23', icon: '♎', color: '#8b5cf6' },
    { name: '蠍座',     range: '10/24-11/22',icon: '♏', color: '#dc2626' },
    { name: '射手座',   range: '11/23-12/21',icon: '♐', color: '#0ea5e9' },
    { name: '山羊座',   range: '12/22-1/19', icon: '♑', color: '#64748b' },
    { name: '水瓶座',   range: '1/20-2/18',  icon: '♒', color: '#3b82f6' },
    { name: '魚座',     range: '2/19-3/20',  icon: '♓', color: '#a855f7' }
  ];

  const FORTUNE_RANKS = [
    '🌌 大大吉（宇宙規模）',
    '⭐ 大吉（銀河系レベル）',
    '🌟 中吉（太陽系規模）',
    '✨ 吉（地球規模）',
    '🌙 小吉（月面レベル）',
    '💫 末吉（衛星軌道）'
  ];

  const FORTUNE_TEXTS = [
    '銀河系全体があなたを応援！隕石落下確率が本日0.0001%低下。宇宙人があなたの判断に注目しています。',
    '太陽系の惑星全てが整列し、あなたに莫大な幸運を送信中。光速の愛があなたに届くでしょう。',
    '本日の幸運は光年スケール。ブラックホールもあなたの前では道を譲ります！',
    '地球の重力が一時的に味方します。転ばない確率94%！',
    '月の引力があなたの髪型を優しく整えます（風がある場合のみ）。',
    '小惑星帯の砂粒1個があなたに微弱な幸運を放射。気のせいかもしれません。',
    '遠い銀河で超新星爆発が起き、その余韻が今日あなたに届きます。エネルギーを感じて！',
    '宇宙の97%を占める暗黒物質があなたを見守っています（見えないけど確かにそこにいます）。',
    'ダークエネルギーがあなたの野望を後押し！宇宙膨張速度でチャンスが広がります。',
    'ケプラー宇宙望遠鏡の引退後の魂があなたを観察し続けています。全ての行動が宇宙の歴史に刻まれる！',
    '今日あなたが息を吸う空気の分子は、かつて恐竜が吸った同じ分子です。それだけで今日は特別！',
    'ニュートリノが今この瞬間も貫通中。あなたは宇宙と一体化しています。'
  ];

  let isSpinning = false;
  let currentAngle = 0;
  let animId = null;
  let targetAngle = 0;
  let spinVelocity = 0;

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Build selector
  function buildSelector() {
    const sel = document.getElementById('zodiac-select');
    ZODIACS.forEach((z, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${z.icon} ${z.name}（${z.range}）`;
      sel.appendChild(opt);
    });
  }

  // Draw wheel
  function drawWheel(angle) {
    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const cx = W / 2, cy = W / 2, r = W / 2 - 4;
    const n = ZODIACS.length;
    const slice = (Math.PI * 2) / n;

    ctx.clearRect(0, 0, W, W);

    ZODIACS.forEach((z, i) => {
      const startA = angle + i * slice - Math.PI / 2;
      const endA = startA + slice;

      // Sector
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startA, endA);
      ctx.closePath();
      ctx.fillStyle = z.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Text
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(startA + slice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'white';
      ctx.font = 'bold 13px sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 3;
      ctx.fillText(z.icon, r - 8, 5);
      ctx.font = '9px sans-serif';
      ctx.fillText(z.name, r - 24, 5);
      ctx.restore();
    });

    // Center circle
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#1e1b4b';
    ctx.fill();
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Center star
    ctx.fillStyle = '#fbbf24';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦', cx, cy);
  }

  function startSpin() {
    if (isSpinning) return;
    const selIdx = parseInt(document.getElementById('zodiac-select').value);

    // Calculate target angle so selected zodiac lands under pointer
    const n = ZODIACS.length;
    const slice = (Math.PI * 2) / n;
    // Extra full rotations (3-7 spins)
    const extraSpins = (3 + Math.floor(Math.random() * 5)) * Math.PI * 2;
    // Target: selected zodiac center points to top (pointer)
    const targetSectorCenter = -(selIdx * slice) + (Math.PI / 2) - slice / 2 + Math.random() * slice * 0.6 - slice * 0.3;
    targetAngle = currentAngle + extraSpins + (targetSectorCenter - (currentAngle % (Math.PI * 2)));

    spinVelocity = (targetAngle - currentAngle) / 120; // 120 frames total rough
    isSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('fortune-box').classList.add('hidden');

    animateSpin(selIdx);
  }

  function animateSpin(selIdx) {
    const diff = targetAngle - currentAngle;
    if (Math.abs(diff) < 0.01) {
      currentAngle = targetAngle;
      drawWheel(currentAngle);
      isSpinning = false;
      document.getElementById('spin-btn').disabled = false;
      showFortune(selIdx);
      return;
    }
    // Ease out
    currentAngle += diff * 0.06;
    drawWheel(currentAngle);
    animId = requestAnimationFrame(() => animateSpin(selIdx));
  }

  function showFortune(selIdx) {
    const z = ZODIACS[selIdx];
    const today = new Date().toLocaleDateString('ja-JP');
    const rankIdx = Math.floor(Math.random() * FORTUNE_RANKS.length);
    const textIdx = Math.floor(Math.random() * FORTUNE_TEXTS.length);

    const box = document.getElementById('fortune-box');
    box.classList.remove('hidden');
    document.getElementById('fortune-zodiac-icon').textContent = z.icon;
    document.getElementById('fortune-zodiac-name').textContent = `${z.name}（${z.range}）`;
    document.getElementById('fortune-date').textContent = today;
    document.getElementById('fortune-rank').textContent = FORTUNE_RANKS[rankIdx];
    document.getElementById('fortune-text').textContent = FORTUNE_TEXTS[textIdx];

    // Save to history
    const history = loadHistory();
    history.unshift({
      zodiac: z.name,
      icon: z.icon,
      rank: FORTUNE_RANKS[rankIdx],
      text: FORTUNE_TEXTS[textIdx],
      date: today
    });
    // Keep max 30
    if (history.length > 30) history.pop();
    localStorage.setItem('zodiac_history', JSON.stringify(history));
    renderHistory();
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem('zodiac_history') || '[]'); } catch { return []; }
  }

  function clearHistory() {
    if (!confirm('履歴を全削除しますか？')) return;
    localStorage.removeItem('zodiac_history');
    renderHistory();
  }

  function renderHistory() {
    const history = loadHistory();
    const list = document.getElementById('history-list');
    const empty = document.getElementById('history-empty');

    if (history.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    list.innerHTML = '';
    history.slice(0, 10).forEach(h => {
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2 text-xs bg-indigo-800 bg-opacity-50 rounded-lg px-2 py-1.5';
      div.innerHTML = `
        <span class="text-base">${escapeHtml(h.icon)}</span>
        <div class="flex-1 min-w-0">
          <span class="font-bold text-yellow-300">${escapeHtml(h.zodiac)}</span>
          <span class="text-indigo-300 ml-1">${escapeHtml(h.rank)}</span>
          <p class="text-indigo-400 truncate mt-0.5">${escapeHtml(h.text)}</p>
        </div>
        <span class="text-indigo-500 whitespace-nowrap">${escapeHtml(h.date)}</span>
      `;
      list.appendChild(div);
    });
  }

  buildSelector();
  drawWheel(currentAngle);
  renderHistory();
</script>
</body>
</html>
